<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thing Thing - Unblocked Games</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #ff4757; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 2px solid #2f3542;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #ff4757;
            background-color: #2f3542;
        }
    </style>
</head>
<body>

    <h1>Thing Thing Games</h1>
    <p>This is my curated collection of unblocked games to stave off being bored in school</p>

    <div class="grid-container">
        <!-- Example Game Card (Repeats for every game you add) -->
        <a href="game-player.html" class="game-card">
            <div>🎮 Retro Game 1</div>
        </a>
        <a href="#" class="game-card">
            <div>🕹️ Retro Game 2</div>
        </a>
    </div>

</body>
</html>
