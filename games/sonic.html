<!DOCTYPE html>
<html>
<head>
    <title>Sonic Arcade - Thing Thing Games</title>
</head>
<body bgcolor="#C1E1C1" style="margin: 0; padding-top: 10px; padding-left: 8px;">

    <!-- Navigation Header Bar -->
    <div style="margin: 0; padding: 0; line-height: 1;">
        <a href="/">Home</a> | 
        <a href="/games/">Games</a>
    </div>
    <hr style="margin-top: 10px; margin-bottom: 15px;">

    <center>
        <h1>Sonic the Hedgehog</h1>
        <p>Controls: Up Arrow to Jump, Down Arrow to Roll/Spin-dash.</p>

        <!-- Centered game window with high-speed performance tags and a Sonic ID -->
        <iframe id="sonic-frame"
                src="sonicfile/index.html" 
                width="800" 
                height="400" 
                frameborder="0" 
                style="border: 2px solid #333; background: #000;" 
                loading="eager"
                importance="high"
                allowfullscreen="true"
                webkitallowfullscreen="true"
                mozallowfullscreen="true">
        </iframe>

        <br><br>

        <!-- Unpolished Fullscreen Button -->
        <button onclick="goFullscreen();" style="padding: 5px 10px; cursor: pointer; font-weight: bold;">
            Fullscreen
        </button>
    </center>

    <!-- Tiny raw script to trigger the fullscreen event -->
    <script>
        function goFullscreen() {
            var iframe = document.getElementById('sonic-frame');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) { /* Safari */
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) { /* IE11 */
                iframe.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
