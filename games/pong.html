<!DOCTYPE html>
<html>
<head>
    <title>Pong - Thing Thing Games</title>
</head>
<body bgcolor="#C1E1C1" style="margin: 0; padding-top: 10px; padding-left: 8px;">

    <!-- Navigation Header Bar -->
    <div style="margin: 0; padding: 0; line-height: 1;">
        <a href="/">Home</a> | 
        <a href="/games/">Games</a>
    </div>
    <hr style="margin-top: 10px; margin-bottom: 15px;">

    <h1>Classic Pong</h1>
    <p>Move your mouse up and down to control the left paddle</p>

    <canvas id="gameCanvas" width="600" height="400" style="background:black;"></canvas>

    <script>
    var canvas, canvasContext;
    var ballX = 50, ballY = 50, ballSpeedX = 10, ballSpeedY = 4;
    var paddle1Y = 250, paddle2Y = 250;
    const PADDLE_HEIGHT = 100, PADDLE_THICKNESS = 10;

    window.onload = function() {
        canvas = document.getElementById('gameCanvas');
        canvasContext = canvas.getContext('2d');
        setInterval(function() { moveEverything(); drawEverything(); }, 1000/30);
        canvas.addEventListener('mousemove', function(evt) {
            var mousePos = calculateMousePos(evt);
            paddle1Y = mousePos.y - (PADDLE_HEIGHT/2);
        });
    }
    function calculateMousePos(evt) {
        var rect = canvas.getBoundingClientRect();
        var root = document.documentElement;
        var mouseX = evt.clientX - rect.left - root.scrollLeft;
        var mouseY = evt.clientY - rect.top - root.scrollTop;
        return { x:mouseX, y:mouseY };
    }
    function moveEverything() {
        paddle2Y += (ballY - (paddle2Y + PADDLE_HEIGHT/2)) * 0.1; // Simple AI
        ballX += ballSpeedX; ballY += ballSpeedY;
        if(ballX < 0) {
            if(ballY > paddle1Y && ballY < paddle1Y+PADDLE_HEIGHT) { ballSpeedX = -ballSpeedX; }
            else { ballX = 300; ballY = 200; ballSpeedX = -ballSpeedX; }
        }
        if(ballX > canvas.width) {
            if(ballY > paddle2Y && ballY < paddle2Y+PADDLE_HEIGHT) { ballSpeedX = -ballSpeedX; }
            else { ballX = 300; ballY = 200; ballSpeedX = -ballSpeedX; }
        }
        if(ballY < 0 || ballY > canvas.height) ballSpeedY = -ballSpeedY;
    }
    function drawEverything() {
        canvasContext.fillStyle = 'black'; canvasContext.fillRect(0,0,canvas.width,canvas.height);
        canvasContext.fillStyle = 'white'; canvasContext.fillRect(0,paddle1Y,PADDLE_THICKNESS,PADDLE_HEIGHT);
        canvasContext.fillRect(canvas.width-PADDLE_THICKNESS,paddle2Y,PADDLE_THICKNESS,PADDLE_HEIGHT);
        canvasContext.beginPath(); canvasContext.arc(ballX,ballY,10,0,Math.PI*2,true); canvasContext.fill();
    }
    </script>
</body>
</html>
